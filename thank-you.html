<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Velvet Voyage</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      body {
        background: linear-gradient(135deg, #f8f4ef, #eef6fb);
      }
      .thankyou-box {
        max-width: 720px;
        margin: 120px auto;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 20px 45px rgba(26, 46, 80, 0.12);
        padding: 48px 32px;
        text-align: center;
      }
      .thankyou-box h1 {
        font-size: 2.5rem;
        color: #1e2d3d;
        margin-bottom: 16px;
      }
      .thankyou-box p {
        font-size: 1.1rem;
        color: #4a5870;
        margin-bottom: 24px;
      }
      .button {
        display: inline-block;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="thankyou-box">
        <h1>Thank you for your inquiry!</h1>
        <p>
          Your travel request has been sent successfully. Our team will get back to you soon with personalized travel options.
        </p>
        <a href="index.html" class="button button-primary">Back to Home</a>
      </div>
    </main>
  </body>
</html>
